button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.dev{height:100%;background:linear-gradient(180deg,#f4f3ef,#e9e8e3);border-radius:30px;border:1px solid #c7c4bc;box-shadow:0 30px 60px -20px #0004,inset 0 1px 0 #fff;display:grid;grid-template-rows:118px 1fr;overflow:hidden}
.cap{font:700 9px var(--G);letter-spacing:1.6px;text-transform:uppercase;color:var(--grey)}
.top{display:flex;align-items:center;gap:28px;padding:0 30px;border-bottom:1px solid var(--line)}
.brand b{font:700 30px/1 var(--G);letter-spacing:-1px;display:block}
.brand b span{color:var(--or)}
.lcd{flex:1;max-width:620px;height:84px;background:#0d0d0d;border-radius:14px;box-shadow:inset 0 0 0 4px #2a2a2a,inset 0 6px 14px #000;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 22px;gap:22px;color:#fff}
.lcd:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px);pointer-events:none}
.lcd .big{font:900 34px/1 var(--Dt);color:var(--or)}
.lcd .lb{font:700 8px var(--G);letter-spacing:1.5px;color:#777;margin-bottom:4px}
.seg{display:flex;gap:2px}.seg i{width:6px;height:16px;background:#2a2a2a}.seg i.on{background:#fff}
.walk{position:relative;width:150px;height:60px;border-left:1px dashed #333;margin-left:auto}
.walk svg{position:absolute;bottom:6px;animation:walk 6s linear infinite}
.walk .gnd{position:absolute;left:0;right:0;bottom:6px;border-top:1px solid #444}
@keyframes walk{from{left:-10px}to{left:130px}}
.keys{display:flex;gap:16px;margin-left:auto}
.key{display:flex;flex-direction:column;align-items:center;gap:6px}
.key button{width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,#fff,#e4e2dc);box-shadow:0 3px 0 #bdb9b0,0 6px 10px #0002,inset 0 1px 0 #fff;display:grid;place-items:center;transition:transform .08s}
.key button:active{transform:translateY(3px);box-shadow:0 0 0 #bdb9b0}
.key.o button{background:linear-gradient(180deg,#ff7a45,#ff5a1f);box-shadow:0 3px 0 #c63e0c,0 6px 10px #0003;color:#fff}
.main{display:grid;grid-template-columns:1fr 372px;min-height:0}
.metro{position:relative;border-right:1px solid var(--line)}
.metro svg{position:absolute;inset:0;width:100%;height:100%}
.side{padding:22px 26px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.mod .hd{display:flex;justify-content:space-between;margin-bottom:10px}
.cdr{display:flex;align-items:center;gap:12px;padding:6px 0}
.cdr .scr{width:64px;height:40px;background:#0d0d0d;border-radius:8px;display:grid;place-items:center;font:900 26px/1 var(--Dt);flex:none;box-shadow:inset 0 0 0 2px #2a2a2a}
.cdr .t{flex:1;font-weight:500;font-size:14px}
.led{width:8px;height:8px;border-radius:50%;flex:none}
.led.crit{background:var(--rd);box-shadow:0 0 8px var(--rd);animation:bk 1s steps(2) infinite}.led.warn{background:var(--ye);box-shadow:0 0 6px var(--ye)}
@keyframes bk{50%{opacity:.25}}
.tg{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.tg:first-of-type{border-top:0}
.sw{width:40px;height:22px;border-radius:20px;background:#d9d6cf;position:relative;flex:none;box-shadow:inset 0 1px 3px #0003}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:.2s}
.sw.on{background:var(--gr)}.sw.on:after{left:21px}
.tg .t{flex:1;font-size:14px}
.tg .x{font:700 11px var(--M);color:var(--or)}
.boss{display:flex;align-items:center;gap:14px}
.boss .n{font:900 54px/0.9 var(--Dt);color:var(--or)}
.float{animation:fl 2.4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-5px)}}
.ping{animation:pg 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pg{from{transform:scale(1);opacity:.8}to{transform:scale(2.4);opacity:0}}
</style></head><body>
<div class="dev">
  <div class="top">
    <div class="brand"><b>QL<span>-</span>1</b><span class="cap">quest log · field unit</span></div>
    <div class="lcd">
      <div><div class="lb">LEVEL</div><div class="big">06</div></div>
      <div><div class="lb">XP 115/250</div><div class="seg" id="seg"></div></div>
      <div><div class="lb">STREAK</div><div class="big" style="color:#fff">06</div></div>
      <div class="walk"><div class="gnd"></div><svg width="22" height="28" viewBox="0 0 11 14" shape-rendering="crispEdges" id="mini"></svg></div>
    </div>
    <div class="keys">
      <div class="key o"><button><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 3v14M3 10h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></button><span class="cap">new</span></div>
      <div class="key"><button><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#151515" stroke-width="2"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14"/></svg></button><span class="cap">cal</span></div>
      <div class="key"><button><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#151515" stroke-width="2"><path d="M3 11l2-7h10l2 7v5H3zM3 11h4l1 2h4l1-2h4"/></svg></button><span class="cap">inbox</span></div>
      <div class="key"><button><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="4" fill="#00a86b"/></svg></button><span class="cap">synced</span></div>
    </div>
  </div>
  <div class="main">
    <section class="metro"><svg id="m"></svg></section>
    <aside class="side">
      <div class="mod"><div class="hd"><span class="cap" style="color:var(--rd)">● urgent</span><span class="cap">days left</span></div><div id="urg"></div></div>
      <div class="mod"><div class="hd"><span class="cap">today</span><span class="cap">0 / 3</span></div><div id="today"></div></div>
      <div class="mod boss"><div class="n">81</div><div><div class="cap">boss · days</div><div style="font-size:17px;font-weight:700;margin-top:2px">AIM 2027 paper</div><div class="cap" style="margin-top:4px;color:var(--bl)">then IROS · 115</div></div></div>
    </aside>
  </div>
</div>
<script>// Shared demo data for style candidates (from personal-os records, 2026-11-06)
const P = {name:'KEVIN', lv:6, xp:115, xpMax:250, streak:6, total:1365, energy:4};
const LINES = [
  {id:'04', short:'GRD',   name:'GRD Paper',      c:'#ff7a1a', prio:3, done:1, total:9, now:'Mold diaphragms', sub:[0,6], boss:{n:'AIM 2027', d:81}},
  {id:'05', short:'ARM',   name:'Dual-Arm',       c:'#2f7bff', prio:3, done:2, total:8, now:'Build hands', late:true, boss:{n:'IROS 2027', d:115}},
  {id:'08', short:'HBPA',  name:'HBPA Actuator',  c:'#ff3d7f', prio:3, done:1, total:7, now:'Finish CAD', due:3},
  {id:'03', short:'NYCU',  name:'NYCU Model',     c:'#14c08a', prio:2, done:0, total:2, now:'Read model'},
  {id:'02', short:'GNSS',  name:'Tensor Tech',    c:'#8b6cff', prio:2, done:1, total:3, now:'Learn GNSS'},
  {id:'06', short:'LIGHT', name:'Finger Light',   c:'#19c3e6', prio:2, done:1, total:4, now:'Pi bring-up', late:true},
  {id:'01', short:'236A',  name:'ECE236A',        c:'#ffc21a', prio:1, done:0, total:3, now:'HW 4', due:5},
  {id:'07', short:'READ',  name:'Reader',         c:'#9aa3b5', prio:1, done:2, total:4, now:'Grade HW5', due:7},
  {id:'09', short:'MRI',   name:'MRI Upkeep',     c:'#2bb673', prio:1, done:0, total:1, now:'Kinematics'},
];
const URGENT = [
  {t:'Finish HBPA CAD', l:'08', d:3},
  {t:'Pistons arrive', l:'08', d:4},
  {t:'EE236A HW 4', l:'01', d:5},
  {t:'Grade MA171A HW5', l:'07', d:7},
];
const LATE = [{t:'Build dual hands', l:'05'}, {t:'Finger Light bring-up', l:'06'}, {t:'Grade HW3', l:'07'}];
const BOSSES = [{n:'AIM 2027', l:'04', d:81}, {n:'IROS 2027', l:'05', d:115}];
const TODAY = [
  {t:'Mold diaphragms', l:'04', sub:[0,6], xp:50},
  {t:'Finish HBPA CAD', l:'08', d:3, xp:50},
  {t:'EE236A HW 4', l:'01', d:5, xp:30},
];
const L = id => LINES.find(x => x.id === id);
const urg = d => d <= 3 ? 'crit' : d <= 7 ? 'warn' : 'ok';
</script>
<script>
const $=id=>document.getElementById(id);
$('seg').innerHTML=[...Array(25)].map((_,i)=>`<i class="${i<11?'on':''}" style="${i===11?'background:#ff5a1f':''}"></i>`).join('');
const MINI=["   ww   ","  wwww  ","wwwwwwww","w oo oo w","wwwwwwww"," wwwwww ","  wwww  "," ww  ww ","ww    ww"];
$('mini').innerHTML=["    o    ","  wwwww  "," w.....w "," w.o.o.w "," w.....w ","  wwwww  ","   ooo   ","  wooow  ","   ooo   ","  w   w  ","  w   w  "," ww   ww "].map((r,j)=>[...r].map((c,i)=>c==='w'?`<rect x="${i}" y="${j}" width="1" height="1" fill="#fff"/>`:c==='o'?`<rect x="${i}" y="${j}" width="1" height="1" fill="#ff5a1f"/>`:'').join('')).join('');
$('urg').innerHTML=URGENT.map(u=>`<div class="cdr"><div class="scr" style="color:${u.d<=3?'#ff2e2e':'#ffc300'}">${String(u.d).padStart(2,'0')}</div><span class="t">${u.t}</span><span class="led ${urg(u.d)}"></span></div>`).join('');
$('today').innerHTML=TODAY.map(q=>`<div class="tg"><button class="sw" onclick="this.classList.toggle('on')"></button><span class="led" style="background:${L(q.l).c}"></span><span class="t">${q.t}</span><span class="x">+${q.xp}</span></div>`).join('');
// metro map
const M=$('m'),W=M.clientWidth,H=M.clientHeight;M.setAttribute('viewBox',`0 0 ${W} ${H}`);
const hub={x:96,y:0},rows=LINES.length,tp=124,gap=(H-tp-46)/(rows-1),xs=420,xe=W-170;hub.y=tp+4*gap;
let s=`<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cfccc4"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#g)"/>`;
s+=`<text x="30" y="40" font-family="Space Grotesk" font-weight="700" font-size="9" letter-spacing="1.6" fill="#8d8a84">MISSION NETWORK</text>`;
let hero=null;const st=[];
LINES.forEach((l,i)=>{
  const y=tp+i*gap,o=(i-4)*6,sx=i<4?170+i*13:i>4?170+(8-i)*13:0;
  const end=xs+(xe-xs)*(l.total/9);
  const d=i===4?`M${hub.x} ${y} L${end} ${y}`:`M${hub.x} ${hub.y+o} L${sx} ${hub.y+o} L${sx} ${y} L${end} ${y}`;
  s+=`<path d="${d}" fill="none" stroke="${l.c}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>`;
  const n=l.total;for(let k=0;k<n;k++){const x=xs+(end-xs)*(n===1?0:k/(n-1));
    if(k<l.done)s+=`<circle cx="${x}" cy="${y}" r="7" fill="${l.c}" stroke="#fff" stroke-width="3"/>`;
    else if(k===l.done){s+=`<circle class="ping" cx="${x}" cy="${y}" r="10" fill="none" stroke="${l.c}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="11" fill="#fff" stroke="#151515" stroke-width="3.5"/><circle cx="${x}" cy="${y}" r="4" fill="${l.c}"/>`;
      if(i===0)hero={x,y};
      s+=i===0?`<text x="${x+34}" y="${y-40}" font-family="Space Grotesk" font-weight="700" font-size="14" fill="#151515">${l.now}</text><text x="${x+34}" y="${y-24}" font-family="Space Mono" font-size="10" fill="#8d8a84">0/6 sub-steps</text>`
        :`<text x="${x}" y="${y-19}" text-anchor="middle" font-family="Space Grotesk" font-weight="500" font-size="11.5" fill="#151515">${l.now}</text>`;
      if(l.due!=null)s+=`<rect x="${x+16}" y="${y+8}" width="30" height="17" rx="4" fill="${l.due<=3?'#ff2e2e':'#ffc300'}"/><text x="${x+31}" y="${y+20}" text-anchor="middle" font-family="Space Mono" font-weight="700" font-size="10.5" fill="${l.due<=3?'#fff':'#151515'}">${l.due}d</text>`;
      if(l.late)s+=`<rect x="${x+16}" y="${y+8}" width="20" height="17" rx="4" fill="#8b6cff"/><text x="${x+26}" y="${y+20}" text-anchor="middle" font-family="Space Mono" font-weight="700" font-size="11" fill="#fff">?</text>`;}
    else s+=`<circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="${l.c}" stroke-width="3"/>`;}
  if(l.boss)s+=`<g transform="translate(${end+18},${y})"><rect x="0" y="-13" width="${l.boss.n.length*7+50}" height="26" rx="13" fill="#151515"/><text x="12" y="4.5" font-family="Space Mono" font-weight="700" font-size="11" fill="#fff">${l.boss.n} <tspan fill="#ff5a1f">${l.boss.d}d</tspan></text></g>`;
  const cw=l.short.length*8.5+70;
  st.push(`<g transform="translate(278,${y})"><rect x="-6" y="-15" width="${cw}" height="30" rx="15" fill="#fff" stroke="${l.c}" stroke-width="3"/><rect x="0" y="-10" width="24" height="20" rx="10" fill="${l.c}"/><text x="12" y="4" text-anchor="middle" font-family="Space Mono" font-weight="700" font-size="10" fill="#fff">${l.id}</text><text x="31" y="4.5" font-family="Space Grotesk" font-weight="700" font-size="12" fill="#151515">${l.short}</text><text x="${l.short.length*8.5+35}" y="4.5" font-family="Space Mono" font-size="9.5" fill="#8d8a84">${l.done}/${l.total}</text></g>`);
});
s+=st.join('');
s+=`<circle cx="${hub.x}" cy="${hub.y}" r="34" fill="#151515"/><circle cx="${hub.x}" cy="${hub.y}" r="25" fill="#fff"/><text x="${hub.x}" y="${hub.y+4}" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="11" letter-spacing="1">NOW</text>
 <text x="${hub.x}" y="${hub.y+56}" text-anchor="middle" font-family="Space Mono" font-size="10" fill="#8d8a84">FRI 11.06</text>`;
// character on GRD current station
s+=`<g transform="translate(${hero.x-26},${hero.y-104})"><g class="float">
 <line x1="26" y1="8" x2="26" y2="0" stroke="#151515" stroke-width="3"/><circle cx="26" cy="0" r="4" fill="#ff5a1f"/>
 <rect x="4" y="8" width="44" height="32" rx="10" fill="#fff" stroke="#151515" stroke-width="3"/><rect x="10" y="14" width="32" height="18" rx="6" fill="#151515"/>
 <rect x="16" y="19" width="6" height="8" rx="1.5" fill="#ff5a1f"/><rect x="30" y="19" width="6" height="8" rx="1.5" fill="#ff5a1f"/>
 <rect x="12" y="42" width="28" height="20" rx="6" fill="#ff5a1f" stroke="#151515" stroke-width="3"/>
 <rect x="15" y="62" width="7" height="10" fill="#151515"/><rect x="30" y="62" width="7" height="10" fill="#151515"/></g></g>`;
M.innerHTML=s;
</script></body></html>
