:root{--ink:#14110f;--cream:#fdf3df;--paper:#fffaf0;--orange:#ff7a1a;--yellow:#ffd23f;--pink:#ff3d9a;--blue:#3a6bff;--purple:#7b5cff;--red:#ff3b30;--D:'Anton',Impact,sans-serif;--B:'Rubik',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:500 14px var(--B);color:var(--ink);background:var(--cream);overflow:hidden}
button{font:inherit;cursor:pointer}
/* header */
.hud{height:92px;background:var(--ink);position:relative;overflow:hidden;display:flex;align-items:center;gap:28px;padding:0 28px;color:#fff}
.hud:before{content:"";position:absolute;inset:-400px -100px;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff07 0 6deg,transparent 6deg 12deg);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hud>*{position:relative}
.logo{font:44px/0.9 var(--D);color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--pink),5px 5px 0 var(--ink);letter-spacing:1px;transform:rotate(-2deg)}
.logo small{display:block;font-size:13px;color:#fff;-webkit-text-stroke:0;text-shadow:none;letter-spacing:3px;margin-top:4px}
.me{display:flex;align-items:center;gap:14px;background:#ffffff0d;border:2px solid #ffffff22;border-radius:18px;padding:8px 16px 8px 8px}
.face{width:60px;height:60px;border-radius:14px;background:var(--yellow);border:3px solid #fff;display:grid;place-items:center;overflow:hidden}
.lvl{font:30px/1 var(--D);color:#fff}.lvl span{color:var(--yellow)}
.xpw{width:250px}
.xp{height:18px;border:3px solid #fff;border-radius:20px;background:#2a2522;overflow:hidden;position:relative}
.xp i{position:absolute;inset:0;width:46%;background:repeating-linear-gradient(90deg,var(--yellow) 0 14px,#ffbf00 14px 18px);border-right:3px solid #fff}
.xpw small{display:flex;justify-content:space-between;font:600 11px var(--B);color:#ffffffa0;margin-top:4px;letter-spacing:1px}
.pill{display:flex;align-items:center;gap:8px;font:26px/1 var(--D);padding:8px 14px;border-radius:14px;border:2px solid #ffffff22;background:#ffffff0d}
.pill small{font:600 10px var(--B);letter-spacing:1.5px;color:#ffffff90;display:block}
.sp{flex:1}
.date{font:22px/1 var(--D);text-align:right;color:#fff;letter-spacing:1px}.date small{display:block;font:600 11px var(--B);color:var(--yellow);letter-spacing:2px;margin-top:3px}
.new{font:22px var(--D);letter-spacing:1px;background:var(--orange);color:#fff;border:3px solid #fff;border-radius:14px;padding:10px 22px;box-shadow:5px 5px 0 var(--pink);-webkit-text-stroke:1px var(--ink);transition:transform .1s}
.new:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--pink)}
/* ticker */
.tape{background:var(--yellow);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-1.2deg);margin:-4px -20px 0;position:relative;z-index:3;overflow:hidden;white-space:nowrap;height:44px}
.tape div{display:inline-block;font:22px/40px var(--D);letter-spacing:1px;animation:tick 28s linear infinite;padding-left:20px}
.tape b{color:var(--red)}.tape em{font-style:normal;color:var(--pink);margin:0 18px}
@keyframes tick{to{transform:translateX(-50%)}}
/* layout */
.wrap{display:grid;grid-template-columns:1fr 360px;gap:24px;padding:22px 28px 0;height:calc(100% - 150px)}
.map{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);overflow:hidden}
.map:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#14110f22 1.4px,transparent 1.6px);background-size:22px 22px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.maptitle{position:absolute;left:24px;top:18px;font:30px var(--D);letter-spacing:1px;z-index:2}
.maptitle span{color:var(--orange);-webkit-text-stroke:1.5px var(--ink)}
.legend{position:absolute;right:20px;top:20px;display:flex;gap:8px;z-index:2}
.tag{font:600 11px var(--B);letter-spacing:1px;padding:5px 10px;border:2px solid var(--ink);border-radius:20px;background:#fff;display:flex;gap:6px;align-items:center}
.tag i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}
/* rail */
.rail{display:flex;flex-direction:column;gap:20px;overflow:hidden;padding-bottom:28px}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--c,var(--ink));padding:16px 18px}
.sticker{display:inline-block;font:26px/1 var(--D);letter-spacing:1px;color:var(--yellow);-webkit-text-stroke:1.5px var(--ink);background:var(--pink);border:3px solid var(--ink);border-radius:12px;padding:6px 12px 4px;transform:rotate(-3deg);margin:-30px 0 8px -6px;box-shadow:3px 3px 0 var(--ink)}
.u{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:2px dashed #14110f22}
.u:first-of-type{border-top:0}
.cd{width:54px;height:54px;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;text-align:center;font:28px/0.8 var(--D);flex:none}
.cd small{display:block;font:700 9px var(--B);letter-spacing:1px;margin-top:-6px}
.cd.crit{background:var(--red);color:#fff;animation:shake 2.4s infinite}.cd.warn{background:var(--yellow)}
@keyframes shake{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-6deg)}94%{transform:rotate(6deg)}97%{transform:rotate(-3deg)}}
.ut{font-weight:700;font-size:15px;line-height:1.15}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-right:6px;vertical-align:-1px}
.q{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px dashed #14110f22}
.q:first-of-type{border-top:0}
.cb{width:34px;height:34px;border:3px solid var(--ink);border-radius:10px;background:#fff;flex:none;box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center}
.cb:hover{background:var(--yellow)}
.cb.on{background:#22c55e}
.cb.on:after{content:"";width:12px;height:7px;border:4px solid var(--ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.qt{flex:1;font-weight:700;font-size:15px}
.xpc{font:18px var(--D);color:var(--orange);-webkit-text-stroke:.8px var(--ink)}
.boss{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--purple)}
.boss b{font:34px/1 var(--D);color:var(--yellow)}
.boss .bn{font:20px var(--D);letter-spacing:1px}
.boss small{display:block;font:600 10px var(--B);letter-spacing:1.5px;color:#ffffff90}
.burst{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
