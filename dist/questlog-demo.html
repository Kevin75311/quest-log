:root{
  --ink:#16130f;--paper:#fffaf0;--cream:#f8efdc;--line:#16130f1f;--line2:#16130f33;
  --acc:#ff6a1a;--hi:#ffd23f;--red:#ef3b2d;--grey:#a59d90;--grey2:#7a7266;
  --D:'Anton',Impact,sans-serif;--B:'Rubik',system-ui,sans-serif;
  --hud:92px;--sub:58px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:500 14px/1.35 var(--B);color:var(--ink);background:var(--cream);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
.sp{flex:1}
::selection{background:var(--hi)}

/* ---------- HUD ---------- */
.hud{height:var(--hud);background:var(--ink);position:relative;overflow:hidden;display:flex;align-items:center;gap:22px;padding:0 26px;color:var(--paper)}
.hud:before{content:"";position:absolute;inset:-500px -100px;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff06 0 6deg,transparent 6deg 12deg);animation:spin 90s linear infinite;pointer-events:none}
.hud>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{font:40px/0.9 var(--D);color:var(--hi);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--acc);letter-spacing:1px;transform:rotate(-2deg);text-align:left;white-space:nowrap}
.logo small{display:block;font-size:12px;color:var(--paper);-webkit-text-stroke:0;text-shadow:none;letter-spacing:3px;margin-top:5px;opacity:.7}
.me{display:flex;align-items:center;gap:14px;border:2px solid #ffffff1f;border-radius:18px;padding:6px 18px 6px 6px}
.face{width:60px;height:60px;border-radius:15px;background:var(--hi);border:3px solid var(--paper);overflow:hidden;position:relative;flex:none}
.face svg{position:absolute;left:-2px;top:2px}
.lvl{font:30px/1 var(--D);white-space:nowrap}.lvl span{color:var(--hi);display:inline-block}
.lvl span.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.5)}}
.xpw{width:230px}
.xp{height:18px;border:3px solid var(--paper);border-radius:20px;background:#2b2621;overflow:hidden;position:relative}
.xp i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,var(--hi) 0 14px,#f2bd1d 14px 18px);border-right:3px solid var(--paper);transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.xp.glow{box-shadow:0 0 0 3px var(--hi),0 0 18px var(--hi)}
.xpw small{display:flex;justify-content:space-between;font:600 10.5px var(--B);color:#fffaf099;margin-top:4px;letter-spacing:1px}
.pill{display:flex;align-items:center;gap:9px;font:26px/1 var(--D);padding:8px 14px;border-radius:14px;border:2px solid #ffffff1f}
.pill small{font:600 10px var(--B);letter-spacing:1.5px;color:#fffaf088;display:block}
.date{font:22px/1 var(--D);text-align:right;letter-spacing:1px;white-space:nowrap}.date small{display:block;font:600 11px var(--B);color:var(--hi);letter-spacing:2px;margin-top:4px}
.new{font:21px var(--D);letter-spacing:1px;background:var(--acc);color:var(--paper);border:3px solid var(--paper);border-radius:14px;padding:10px 20px;box-shadow:5px 5px 0 var(--hi);transition:transform .1s,box-shadow .1s;white-space:nowrap}
.new:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--hi)}
.new:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--hi)}

/* ---------- sub nav ---------- */
.subnav{height:var(--sub);display:flex;align-items:center;gap:10px;padding:10px 30px 0}
.tabs{display:flex;gap:10px}
.tab{font:18px/1 var(--D);letter-spacing:1px;padding:9px 16px 8px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s}
.tab:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.tab.on{background:var(--ink);color:var(--hi);box-shadow:4px 4px 0 var(--acc)}
.tab b{font-weight:400;background:var(--acc);color:var(--paper);border-radius:8px;padding:1px 6px;margin-left:4px;font-size:14px}
.tab b:empty{display:none}
.sync{display:flex;align-items:center;gap:8px;font:700 11px var(--B);letter-spacing:1.4px;padding:8px 12px;border:2px solid var(--ink);border-radius:20px;background:var(--paper)}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.sync.pending i,.sync.pushing i{background:var(--hi);border:2px solid var(--ink);animation:blink 1s infinite}
.sync.synced i{background:#2fb36b}
.sync.error i,.sync.conflict i{background:var(--red);animation:blink .8s infinite}
.sync.error,.sync.conflict{border-color:var(--red);color:var(--red)}
@keyframes blink{50%{opacity:.35}}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:26px;padding:16px 30px 0;height:calc(100% - var(--hud) - var(--sub))}
.panel{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;margin-bottom:28px;display:flex;flex-direction:column;min-height:0}
.panel:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#16130f1a 1.3px,transparent 1.5px);background-size:22px 22px;pointer-events:none}
.ph{position:relative;display:flex;align-items:center;gap:10px;padding:18px 22px 8px;flex:none;flex-wrap:wrap}
.ph h2{font:28px/1 var(--D);letter-spacing:1px;margin:0;white-space:nowrap}.ph h2 span{color:var(--acc);-webkit-text-stroke:1.2px var(--ink)}
.ph .hint{font:600 12px var(--B);color:var(--grey2)}
.pb{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.btn{font:16px/1 var(--D);letter-spacing:1px;padding:8px 13px 7px;border:3px solid var(--ink);border-radius:11px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);white-space:nowrap;transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--hi)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper)}.btn.dark:hover{color:var(--hi)}
.btn.acc{background:var(--acc);color:var(--paper)}
.btn.sm{font-size:13px;padding:6px 9px 5px;border-width:2.5px;border-radius:9px;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{border-color:transparent;box-shadow:none;background:none}
.btn.ghost:hover{background:#16130f0d}
.tag{font:700 10.5px var(--B);letter-spacing:1px;padding:5px 10px;border:2px solid var(--ink);border-radius:20px;background:var(--paper);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tag i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);font-style:normal;display:grid;place-items:center;font-size:8px}

/* ---------- mission network ---------- */
.net{position:relative;padding:8px 26px 40px 170px;min-width:760px}
.trunks{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.hub{position:absolute;left:32px;width:84px;height:84px;margin-top:-42px;border-radius:50%;background:var(--hi);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;font:26px var(--D);letter-spacing:1px;z-index:2;transition:top .35s}
.hub small{position:absolute;top:92px;left:50%;transform:translateX(-50%) rotate(-4deg);background:var(--ink);color:var(--paper);font:14px var(--D);letter-spacing:1px;border-radius:7px;padding:4px 8px 3px;white-space:nowrap}
.row{position:relative;margin:0 0 14px}
.rhead{display:flex;align-items:center;gap:14px;min-height:50px}
.chip{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 5px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);flex:none;width:172px;transition:transform .12s,background .15s,box-shadow .12s}
.chip:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);background:#fff}
.chip .id{background:var(--ink);color:var(--paper);font:13px/1 var(--D);border-radius:12px;padding:5px 7px 4px}
.chip .nm{font:18px/1 var(--D);letter-spacing:1px}
.chip .ct{font:700 11px var(--B);color:var(--grey);margin-left:auto}
.chip .car{width:16px;height:16px;transition:transform .3s}
.row.low .chip{border-color:var(--grey);box-shadow:3px 3px 0 var(--grey)}
.row.low .chip .id{background:var(--grey)}.row.low .chip .nm{color:var(--grey2)}
.row.open .chip{background:var(--ink);color:var(--paper);box-shadow:3px 3px 0 var(--acc)}
.row.open .chip .id{background:var(--acc)}.row.open .chip .ct{color:var(--hi)}.row.open .chip .car{transform:rotate(90deg)}
.mini{display:flex;align-items:center;gap:0;flex:none}
.mini i{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);display:block}
.mini i.d{background:var(--ink)}
.mini i.c{background:var(--acc);width:15px;height:15px}
.mini b{display:block;width:10px;height:3px;background:var(--ink)}
.mini b.dot{background:radial-gradient(circle,var(--ink) 1.3px,transparent 1.6px) 0 50%/5px 4px repeat-x}
.row.low .mini i{border-color:var(--grey)}.row.low .mini i.d{background:var(--grey)}.row.low .mini b{background:var(--grey)}.row.low .mini b.dot{background:radial-gradient(circle,var(--grey) 1.3px,transparent 1.6px) 0 50%/5px 4px repeat-x}
.cur{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 5px;border:2.5px solid var(--ink);border-radius:15px;background:var(--paper);box-shadow:2px 2px 0 var(--ink);font:700 12.5px var(--B);white-space:nowrap;max-width:none;flex:0 1 auto;min-width:0}
.cur .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cur:not(:has(.d,.qi)){padding-left:12px}
.cur:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.cur.crit{background:var(--red);color:var(--paper)}
.cur.warn{background:var(--hi)}
.cur .qi{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font:12px var(--D);flex:none}
.cur .d{font:14px/1 var(--D);letter-spacing:.5px;background:var(--ink);color:var(--paper);border-radius:10px;padding:4px 7px 3px;flex:none}
.cur.warn .d{background:var(--ink);color:var(--hi)}
.cur.crit .d{background:var(--paper);color:var(--red)}
.bt{font:14px/1 var(--D);letter-spacing:1px;background:var(--ink);color:var(--paper);border-radius:9px;padding:6px 9px 5px;white-space:nowrap;margin-left:auto;flex:none}
.bt b{color:var(--hi);font-weight:400}
.done-line{font:700 12px var(--B);color:var(--grey2)}
/* expanded */
.exp{overflow:hidden}
.exp-in{margin:12px 0 6px;border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:5px 5px 0 var(--ink)}
.exp-top{display:flex;align-items:flex-start;gap:14px;padding:14px 18px 6px}
.exp-top h3{margin:0;font:24px/1.05 var(--D);letter-spacing:.5px}
.exp-top p{margin:4px 0 0;color:var(--grey2);font-size:13px;max-width:520px}
.exp-top .acts{margin-left:auto;display:flex;gap:8px;flex:none}
.trail{display:flex;overflow-x:auto;padding:16px 18px 10px;scrollbar-width:thin;cursor:grab}
.trail.drag{cursor:grabbing}
.stn{position:relative;width:168px;flex:none;text-align:center;padding-top:44px;cursor:pointer}
.stn .seg{position:absolute;left:50%;width:100%;top:15px;height:6px}
.stn .seg.solid{background:var(--ink);height:6px}
.stn .seg.dots{background:radial-gradient(circle,var(--ink) 2.8px,transparent 3.2px) 0 50%/14px 8px repeat-x;height:8px;top:14px}
.stn:last-child .seg{display:none}
.stn .o{position:absolute;left:50%;top:0;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;border:4px solid var(--ink);background:var(--paper);display:grid;place-items:center;z-index:1;transition:transform .15s}
.stn:hover .o{transform:translateX(-50%) scale(1.12)}
.stn.done .o{background:var(--ink)}
.stn.done .o:after{content:"";width:12px;height:7px;border:3.5px solid var(--paper);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.stn.now .o{background:var(--acc);box-shadow:3px 3px 0 var(--ink)}
.stn.now .o:before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--acc);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}
.stn .t{font:700 12px/1.25 var(--B);padding:0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stn.done .t{color:var(--grey2);text-decoration:line-through;text-decoration-color:#16130f55}
.stn .when{display:inline-block;margin-top:5px;font:700 10.5px var(--B);letter-spacing:.5px;padding:2px 7px;border-radius:9px;border:2px solid var(--ink)}
.stn .when.crit{background:var(--red);color:var(--paper)}.stn .when.warn{background:var(--hi)}.stn .when.late{background:var(--ink);color:var(--paper)}.stn .when.ok{background:var(--paper)}
.steps{padding:4px 18px 16px}
.st{border-top:2px dashed var(--line);padding:10px 0}
.st:first-child{border-top:0}
.st .sr{display:flex;align-items:center;gap:12px}
.st .tt{flex:1;min-width:0;cursor:pointer}
.st .tt b{font-weight:700;font-size:15px;display:block}
.st .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chipx{font:700 10.5px var(--B);letter-spacing:.4px;padding:2px 8px;border-radius:10px;border:2px solid var(--ink);background:var(--paper);white-space:nowrap}
.chipx.id{border-color:var(--line2);color:var(--grey2);font-weight:600}
.chipx.crit{background:var(--red);color:var(--paper)}.chipx.warn{background:var(--hi)}.chipx.late{background:var(--ink);color:var(--paper)}
.chipx.hi{background:var(--ink);color:var(--paper)}.chipx.lo{border-color:var(--grey);color:var(--grey2)}
.chipx.doing{border-color:var(--acc);color:var(--acc)}
.st.done .tt b{color:var(--grey2);text-decoration:line-through}
.st.now{background:linear-gradient(90deg,#ff6a1a14,transparent 60%);margin:0 -18px;padding:10px 18px;border-top-color:transparent}
.st.flash{animation:flash 1.4s}
@keyframes flash{0%,40%{background:#ffd23f88}}
.ic{width:34px;height:34px;border:2.5px solid var(--ink);border-radius:10px;display:grid;place-items:center;background:var(--paper);flex:none;font:16px var(--D)}
.ic:hover{background:var(--hi)}
.ic.on{background:var(--ink);color:var(--hi)}
.ic svg{width:16px;height:16px}
.sbody{margin:10px 0 2px 46px}
.sub{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.sub .x{margin-left:auto;opacity:0;color:var(--grey2);font:15px var(--D);padding:2px 6px}
.sub:hover .x{opacity:1}
.sub.dn span{color:var(--grey);text-decoration:line-through}
.addrow{display:flex;gap:8px;margin-top:6px}
.inp{flex:1;min-width:0;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);padding:8px 11px;font-size:14px;outline:none}
.inp:focus{box-shadow:3px 3px 0 var(--acc)}
.note{font-size:13px;color:var(--grey2);margin:6px 0}
.cmt{font-size:13px;margin:6px 0;padding:6px 10px;border-left:4px solid var(--hi);background:#ffd23f1f;border-radius:0 8px 8px 0}
.cmt small{display:block;color:var(--grey2);font-size:11px}
.more{font:700 12px var(--B);color:var(--grey2);padding:8px 0 0;letter-spacing:.5px}
.more:hover{color:var(--ink)}

/* checkbox */
.cb{width:32px;height:32px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);flex:none;box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;transition:transform .1s,background .15s}
.cb:hover{background:var(--hi)}
.cb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cb.on,.cb.done{background:var(--acc)}
.cb.done{background:var(--ink)}
.cb.on:after,.cb.done:after{content:"";width:12px;height:7px;border:4px solid var(--paper);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.cb.s{width:22px;height:22px;border-radius:7px;border-width:2.5px;box-shadow:2px 2px 0 var(--ink)}
.cb.s.on:after{width:8px;height:5px;border-width:3px}
/* completion form */
.cform{overflow:hidden}
.cform-in{margin:10px 0 2px 0;padding:12px;border:2.5px dashed var(--ink);border-radius:14px;background:var(--cream)}
.cform textarea{width:100%;min-height:60px;resize:vertical;border:2.5px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:14px;background:var(--paper);outline:none}
.cform textarea:focus{box-shadow:3px 3px 0 var(--acc)}
.cform .row2{display:flex;gap:8px;align-items:center;margin-top:8px}

/* ---------- rail ---------- */
.rail{display:flex;flex-direction:column;gap:20px;overflow-y:auto;overflow-x:hidden;padding:14px 10px 30px 4px;margin-right:-10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:16px 18px;flex:none}
.sticker{display:inline-block;font:23px/1 var(--D);letter-spacing:1px;color:var(--paper);background:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 12px 4px;margin:-30px 0 6px -6px}
.sticker.a{background:var(--acc)}
.u{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:2px dashed var(--line);width:100%;text-align:left;border-radius:8px}
.u:first-child{border-top:0}
.u:hover .ut{text-decoration:underline;text-decoration-thickness:2px}
.cd{width:44px;height:44px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;text-align:center;font:23px/0.8 var(--D);flex:none;background:var(--paper)}
.cd small{display:block;font:700 8.5px var(--B);letter-spacing:1px;margin-top:-6px}
.cd.crit{background:var(--red);color:var(--paper);animation:shake 2.6s infinite}.cd.warn{background:var(--hi)}
@keyframes shake{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-6deg)}94%{transform:rotate(6deg)}97%{transform:rotate(-3deg)}}
.ut{font-weight:700;font-size:14px;line-height:1.2;min-width:0}.ut .tl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ut small{display:block;font:600 11px var(--B);color:var(--grey);letter-spacing:.4px;margin-top:2px}
.late-h{width:100%;font:14px var(--D);letter-spacing:1.2px;color:var(--ink);margin:8px 0 2px;padding:7px 10px;display:flex;align-items:center;gap:8px;border:2.5px dashed var(--ink);border-radius:10px}
.late-h:hover{background:#16130f0d}
.late-h .qi{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font:12px var(--D)}
.late-i{display:flex;align-items:center;gap:8px;font:600 13px var(--B);padding:4px 0;width:100%;text-align:left}
.late-i i{width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:11px var(--D);font-style:normal;flex:none}
.late-i span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.late-i small{color:var(--grey);font-size:11px}
.late-i:hover span{text-decoration:underline}
.q{border-top:2px dashed var(--line);padding:8px 0}
.q:first-child{border-top:0}
.q .qr{display:flex;align-items:center;gap:12px}
.qt{flex:1;min-width:0;font-weight:700;font-size:14.5px;line-height:1.18;cursor:pointer;text-align:left}
.qt .tl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qt small{display:block;font:600 11px var(--B);color:var(--grey);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt:hover{text-decoration:underline;text-decoration-thickness:2px}
.xpc{font:17px var(--D);color:var(--ink);background:var(--hi);border:2px solid var(--ink);border-radius:8px;padding:2px 6px 1px;flex:none}
.q .drop{opacity:0;font:15px var(--D);color:var(--grey2);padding:2px 4px;transition:opacity .15s}
.q:hover .drop{opacity:1}
.pick{width:100%;margin-top:8px;border:2.5px dashed var(--ink);border-radius:12px;padding:10px;font:16px var(--D);letter-spacing:1px;color:var(--grey2)}
.pick:hover{color:var(--ink);background:#ffd23f33}
.clear{display:flex;align-items:center;gap:12px;padding:6px 0}
.clear b{font:22px var(--D);letter-spacing:1px;display:block}
/* boss stack */
.bosses{position:relative;height:136px;flex:none;cursor:pointer;margin:0 6px 4px 0}
.boss{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;background:var(--ink);color:var(--paper);border-radius:20px;padding:13px 18px;border:3px solid var(--ink);transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .3s;transform-origin:50% 100%}
.boss.b0{z-index:3;box-shadow:6px 6px 0 var(--acc)}
.boss.b1{z-index:2;transform:translate(10px,10px) rotate(2.5deg);background:#2c2722}
.boss.b2{z-index:1;transform:translate(18px,18px) rotate(5deg);background:#3a342e}
.boss.b1>*,.boss.b2>*{opacity:0}
.boss.out{transform:translate(-40px,-14px) rotate(-12deg) scale(.96);opacity:0}
.boss .top{display:flex;align-items:center;gap:12px}
.boss .bn{font:21px/1.05 var(--D);letter-spacing:1px}
.boss small{display:block;font:600 10px var(--B);letter-spacing:1.5px;color:#fffaf088}
.boss .dd{margin-left:auto;text-align:right}.boss .dd b{font:38px/1 var(--D);color:var(--hi);font-weight:400}
.boss .hp{display:flex;align-items:center;gap:8px;font:700 10px var(--B);letter-spacing:1.4px;color:#fffaf099}
.boss .hp div{flex:1;height:12px;border:2.5px solid var(--paper);border-radius:8px;overflow:hidden;background:#2b2621}
.boss .hp i{display:block;height:100%;background:var(--red)}
.boss .dots{display:flex;gap:5px;margin-left:auto}
.boss .dots i{width:7px;height:7px;border-radius:50%;background:#fffaf044}.boss .dots i.on{background:var(--hi)}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:8px}
.month{font:22px var(--D);letter-spacing:1px;min-width:150px}
.cal{position:relative;flex:1;min-height:0;overflow:auto;margin:0 14px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);cursor:grab;scrollbar-width:thin}
.cal.drag{cursor:grabbing}
.cg{position:relative}
.ch{position:sticky;top:0;z-index:5;display:flex;background:var(--paper);border-bottom:3px solid var(--ink)}
.ch .gut,.cad .gut{position:sticky;left:0;z-index:6;background:var(--paper);width:58px;flex:none;border-right:2px solid var(--line2)}
.dh{flex:none;padding:8px 10px 6px;border-left:2px solid var(--line);font:700 11px var(--B);letter-spacing:1px;color:var(--grey2)}
.dh b{display:block;font:24px/1 var(--D);color:var(--ink);letter-spacing:.5px}
.dh.today{background:var(--hi)}
.dh.wk{border-left:3px solid var(--ink)}
.dh.past{opacity:.55}
.cad{position:sticky;top:58px;z-index:4;display:flex;background:#fffdf7;border-bottom:2px solid var(--line2);min-height:34px}
.cad .day{flex:none;border-left:2px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px}
.cad .gut{font:700 9.5px var(--B);color:var(--grey);display:grid;place-items:center;letter-spacing:1px}
.ad{font:700 10.5px var(--B);border:2px solid var(--ink);border-radius:7px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--paper);cursor:pointer;text-align:left}
.ad.dl{border-style:dashed}.ad.dl.due{border-style:solid}
.ad.crit{background:var(--red);color:var(--paper)}.ad.warn{background:var(--hi)}.ad.late{background:var(--ink);color:var(--paper)}
.ad.g{background:#efe6d3}
.cbody{display:flex;position:relative}
.cbody .gut{position:sticky;left:0;z-index:3;width:58px;flex:none;background:var(--paper);border-right:2px solid var(--line2)}
.cbody .gut div{font:700 10px var(--B);color:var(--grey);text-align:right;padding:2px 6px 0 0;box-sizing:border-box}
.col{position:relative;flex:none;border-left:2px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 44px}
.col.wk{border-left:3px solid var(--ink)}
.col.today{background-color:#ffd23f1c}
.col.past{background-color:#16130f06}
.ev{position:absolute;left:4px;right:4px;border:2.5px solid var(--ink);border-radius:9px;padding:4px 7px;font:700 11.5px/1.2 var(--B);background:var(--paper);box-shadow:2px 2px 0 var(--ink);overflow:hidden;cursor:pointer;text-align:left}
.ev small{display:block;font-weight:600;font-size:10.5px;color:var(--grey2)}
.ev.g{background:#fff3d6}
.ev.mine{background:var(--hi)}
.ev.half{right:calc(50% + 1px)}.ev.half2{left:calc(50% + 1px)}
.nowl{position:absolute;left:0;right:0;height:3px;background:var(--red);z-index:2}
.nowl:before{content:"";position:absolute;left:-5px;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--red)}
.calnote{font:600 11.5px var(--B);color:var(--grey2)}

/* ---------- inbox ---------- */
.ibox{padding:6px 22px 22px}
.cap{display:flex;gap:10px;margin-bottom:16px}
.cap .inp{font-size:15px;padding:12px 14px}
.ii{display:flex;align-items:center;gap:10px;padding:12px 14px;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:4px 4px 0 var(--ink);margin-bottom:12px;flex-wrap:wrap}
.ii .t{flex:1;min-width:200px;font-weight:700}
.ii .t small{display:block;color:var(--grey);font-weight:600;font-size:11px;margin-top:2px}
.sel{border:2.5px solid var(--ink);border-radius:9px;background:var(--paper);padding:6px 8px;font:600 13px var(--B)}
.empty{display:flex;align-items:center;gap:16px;padding:30px 10px}
.empty b{font:26px var(--D);letter-spacing:1px;display:block}

/* ---------- modal / popover ---------- */
.scrim{position:fixed;inset:0;background:#16130f66;display:none;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:50}
.scrim.on{display:flex;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,94vw);background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;animation:pop .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(20px) scale(.94);opacity:0}}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--ink);color:var(--paper)}
.mh b{font:22px var(--D);letter-spacing:1px;color:var(--hi)}
.mtabs{display:flex;gap:7px;padding:14px 18px 0;flex-wrap:wrap}
.mtab{font:14px/1 var(--D);letter-spacing:1px;padding:8px 11px 7px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper)}
.mtab.on{background:var(--acc);color:var(--paper)}
.mb{padding:14px 18px;display:grid;gap:12px;max-height:62vh;overflow:auto}
.fld{display:grid;gap:5px}
.fld label{font:700 11px var(--B);letter-spacing:1px;color:var(--grey2);text-transform:uppercase}
.fld input,.fld select,.fld textarea{border:2.5px solid var(--ink);border-radius:10px;background:#fff;padding:9px 11px;font-size:14px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{box-shadow:3px 3px 0 var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.chk{display:flex;align-items:center;gap:8px;font:600 13px var(--B)}
.mf{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:2px dashed var(--line2)}
.mf .hint{flex:1;font:600 11.5px var(--B);color:var(--grey2)}
.err{color:var(--red);font:700 12px var(--B)}
.pk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;text-align:left;width:100%}
.pk:hover{background:var(--hi)}
.pk .t{flex:1;font-weight:700}.pk .t small{display:block;color:var(--grey2);font-weight:600;font-size:11px}
.pop{position:fixed;z-index:60;display:none;width:300px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:14px 16px}
.pop.on{display:block;animation:pop .2s}
.pop h4{margin:0 0 6px;font:20px/1.1 var(--D);letter-spacing:.5px}
.pop p{margin:4px 0;font-size:13px}
.pop .r{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.log{font-size:12px;margin-top:8px;max-height:200px;overflow:auto}
.log div{padding:5px 0;border-top:1px dashed var(--line2)}
.log code{font:700 11px ui-monospace,monospace;color:var(--acc);margin-right:6px}

/* ---------- toasts / fx ---------- */
.toasts{position:fixed;left:24px;bottom:24px;display:flex;flex-direction:column;gap:10px;z-index:70}
.toast{background:var(--ink);color:var(--paper);border-radius:14px;padding:11px 16px;box-shadow:5px 5px 0 var(--acc);font:600 13px var(--B);max-width:380px;animation:tin .35s cubic-bezier(.3,1.5,.5,1)}
.toast b{font:17px var(--D);letter-spacing:1px;color:var(--hi);display:block;font-weight:400}
.toast.err{box-shadow:5px 5px 0 var(--red)}
@keyframes tin{from{transform:translateY(20px) scale(.9);opacity:0}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.coin{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--hi);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font:9px/17px var(--D);text-align:center;color:var(--ink)}
.plus{position:fixed;font:30px var(--D);color:var(--hi);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);letter-spacing:1px}
.lvup{position:fixed;inset:0;display:none;place-items:center;z-index:90;pointer-events:none;background:radial-gradient(circle,#ffd23f55,transparent 60%)}
.lvup.on{display:grid}
.lvup .box{text-align:center;animation:lv 2.2s ease forwards}
.lvup .box b{display:block;font:64px/1 var(--D);color:var(--hi);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--acc);letter-spacing:2px}
@keyframes lv{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.g-tail{animation:tail 1.4s ease-in-out infinite;transform-origin:30px 140px}
@keyframes tail{50%{transform:rotate(18deg)}}
.g-neck{animation:sway 3.2s ease-in-out infinite;transform-origin:91px 136px}
@keyframes sway{50%{transform:rotate(-4deg)}}
.g-blink{animation:gblink 4.4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes gblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.g-ear{animation:ear 4s ease-in-out infinite;transform-box:fill-box;transform-origin:right center}
@keyframes ear{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-22deg)}90%{transform:rotate(0)}}
.hop{animation:hop .5s ease-in-out 3}
@keyframes hop{50%{transform:translateY(-14px)}}
.login{position:fixed;inset:0;background:var(--cream);display:grid;place-items:center;z-index:100}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .wrap{grid-template-columns:minmax(0,1fr) 300px;gap:18px;padding:14px 16px 0}
  .xpw{width:150px}.hide-s{display:none}
}
@media (max-width:820px){
  :root{--hud:72px;--sub:54px}
  body{overflow:auto}
  .hud{gap:12px;padding:0 14px}
  .logo{font-size:26px}.logo small{display:none}
  .me{padding:4px 10px 4px 4px;gap:8px}.face{width:46px;height:46px}.face svg{transform:scale(.78);transform-origin:0 0}
  .lvl{font-size:22px}.xpw{width:90px}.xpw small span:last-child{display:none}
  .new{padding:6px 12px;font-size:20px;box-shadow:3px 3px 0 var(--hi)}.new span{display:none}
  .logo{font-size:22px;text-shadow:2px 2px 0 var(--acc);-webkit-text-stroke:1px var(--ink)}
  .xpw{width:64px}.xpw small{display:none}.lvl{font-size:20px}
  .tabs{gap:8px}.tab{white-space:nowrap}
  .sync span{display:none}.sync{padding:10px}
  .ph .tag,.ph .hint{display:none}
  .cur{max-width:calc(100vw - 80px)}
  .subnav{padding:10px 14px 0;overflow-x:auto}
  .tab{font-size:15px;padding:8px 11px 7px}
  .wrap{display:flex;flex-direction:column;height:auto;padding:12px 14px 30px}
  .rail{order:-1;margin-bottom:22px!important}
  .bt{display:none}
  .panel{height:72vh;margin-bottom:26px}
  .rail{overflow:visible;padding:14px 0 0;margin:0}
  .net{padding-left:16px;min-width:0}
  .trunks,.hub{display:none}
  .rhead{flex-wrap:wrap;gap:8px}
  .mini{display:none}
  .bt{margin-left:0}
  .chip{width:auto}
  .exp-top{flex-wrap:wrap}.exp-top .acts{margin-left:0}
  .sbody{margin-left:0}
}
</style>
</head>

<script>/* Quest Log — shared state logic. Runs in the browser (demo mode) and in Node (server).
 * State shape:
 *   lines:  [{id, short, name, prio, blurb, boss:{name,date,note}|null, steps:[Step]}]
 *   Step:   {id, title, status:'todo'|'doing'|'done', priority:'high'|'normal'|'low',
 *            planned?, due?, note?, checkpoint?, subs:[{id,t,done,doneAt?}], comments:[{at,text}], doneAt?}
 *   player: {xp, streak, lastActive, history:[{at,kind,line,step,title,xp,comment}]}
 *   focus:  [{line, step}]          (today's quests, max 3)
 *   events: [{id,date,start,end,allDay,title,line}]
 *   inbox:  [{id,t,at}]
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.QuestReducer = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  const XP = { high: 50, normal: 30, low: 15 };
  const SUB_XP = 10, LEVEL_XP = 250, FOCUS_MAX = 3;

  const clone = o => JSON.parse(JSON.stringify(o));
  const rid = p => p + '-' + Math.random().toString(36).slice(2, 8);
  const dayDiff = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5);

  function level(xp) { return 1 + Math.floor(xp / LEVEL_XP); }
  function deadlineOf(s) { return s.due ? { date: s.due, kind: 'due' } : s.planned ? { date: s.planned, kind: 'plan' } : null; }
  function urgency(s, today) {
    if (s.status === 'done') return null;
    const d = deadlineOf(s); if (!d) return null;
    const n = dayDiff(today, d.date);
    return { days: n, kind: d.kind, date: d.date, level: n < 0 ? 'late' : n <= 3 ? 'crit' : n <= 7 ? 'warn' : 'ok' };
  }
  function frontier(line) { const i = line.steps.findIndex(s => s.status !== 'done'); return i < 0 ? line.steps.length : i; }
  function findLine(st, id) { const l = st.lines.find(x => x.id === id); if (!l) throw new Error('Unknown mission line ' + id); return l; }
  function findStep(l, id) { const s = l.steps.find(x => x.id === id); if (!s) throw new Error('Unknown step ' + id); return s; }
  function nextTaskId(st, today) {
    const p = 'T-' + today.replace(/-/g, '') + '-';
    let n = 0; st.lines.forEach(l => l.steps.forEach(s => { if (s.id && s.id.startsWith(p)) n = Math.max(n, +s.id.slice(p.length) || 0); }));
    (st.knownIds || []).forEach(id => { if (id.startsWith(p)) n = Math.max(n, +id.slice(p.length) || 0); });
    return p + String(n + 1).padStart(2, '0');
  }
  function touchStreak(p, today) {
    if (p.lastActive === today) return;
    p.streak = p.lastActive && dayDiff(p.lastActive, today) === 1 ? (p.streak || 0) + 1 : 1;
    p.lastActive = today;
  }
  function award(st, ctx, entry) {
    const p = st.player; p.xp = Math.max(0, (p.xp || 0) + entry.xp);
    if (entry.xp > 0) touchStreak(p, ctx.today);
    p.history = [{ at: ctx.now, ...entry }, ...(p.history || [])].slice(0, 400);
  }
  const clean = (v, max = 300) => String(v == null ? '' : v).replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, max);
  const okDate = v => (v && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : undefined);
  const okTime = v => (v && /^\d{2}:\d{2}$/.test(v) ? v : undefined);
  const okPrio = v => (['high', 'normal', 'low'].includes(v) ? v : 'normal');

  /* apply(state, action, ctx) -> {state, msg, xp}
   * ctx = {today:'YYYY-MM-DD', now: ISO string} */
  function apply(state0, a, ctx) {
    const st = clone(state0); let msg = '', xp = 0;
    st.player = st.player || { xp: 0, streak: 0, history: [] };
    st.focus = st.focus || []; st.events = st.events || []; st.inbox = st.inbox || [];
    switch (a.type) {
      case 'complete_step': {
        const l = findLine(st, a.line), s = findStep(l, a.step);
        if (s.status === 'done') break;
        s.status = 'done'; s.doneAt = ctx.now;
        const c = clean(a.comment, 2000); if (c) (s.comments = s.comments || []).push({ at: ctx.now, text: c });
        xp = XP[s.priority] || 30;
        award(st, ctx, { kind: 'step', line: l.id, step: s.id, title: s.title, xp, comment: c || undefined });
        st.focus = st.focus.filter(f => !(f.line === l.id && f.step === s.id));
        msg = `quest(${l.id}): complete ${s.id} "${s.title}" +${xp}xp`;
        break;
      }
      case 'reopen_step': {
        const l = findLine(st, a.line), s = findStep(l, a.step);
        if (s.status !== 'done') break;
        s.status = 'todo'; delete s.doneAt; xp = -(XP[s.priority] || 30);
        award(st, ctx, { kind: 'reopen', line: l.id, step: s.id, title: s.title, xp });
        msg = `quest(${l.id}): reopen ${s.id}`;
        break;
      }
      case 'add_step': {
        const l = findLine(st, a.line), title = clean(a.title); if (!title) throw new Error('Title is required');
        const s = { id: nextTaskId(st, ctx.today), title, status: 'todo', priority: okPrio(a.priority), subs: [], comments: [] };
        if (okDate(a.planned)) s.planned = a.planned; if (okDate(a.due)) s.due = a.due; if (clean(a.note)) s.note = clean(a.note, 2000);
        if (a.position === 'next') l.steps.splice(frontier(l) + 1, 0, s); else l.steps.push(s);
        (st.knownIds = st.knownIds || []).push(s.id);
        if (a.today && st.focus.length < FOCUS_MAX) st.focus.push({ line: l.id, step: s.id });
        msg = `quest(${l.id}): add ${s.id} "${title}"`;
        break;
      }
      case 'edit_step': {
        const l = findLine(st, a.line), s = findStep(l, a.step);
        if (a.title != null && clean(a.title)) s.title = clean(a.title);
        if (a.priority) s.priority = okPrio(a.priority);
        ['planned', 'due'].forEach(k => { if (k in a) { if (okDate(a[k])) s[k] = a[k]; else delete s[k]; } });
        if ('note' in a) { const n = clean(a.note, 2000); if (n) s.note = n; else delete s.note; }
        if (a.status === 'doing' || a.status === 'todo') { if (s.status !== 'done') s.status = a.status; }
        if (typeof a.move === 'number') { const i = l.steps.indexOf(s), j = Math.max(0, Math.min(l.steps.length - 1, i + a.move)); l.steps.splice(i, 1); l.steps.splice(j, 0, s); }
        msg = `quest(${l.id}): edit ${s.id}`;
        break;
      }
      case 'delete_step': {
        const l = findLine(st, a.line), s = findStep(l, a.step);
        l.steps = l.steps.filter(x => x !== s); st.focus = st.focus.filter(f => !(f.line === l.id && f.step === s.id));
        msg = `quest(${l.id}): delete ${s.id} "${s.title}"`;
        break;
      }
      case 'toggle_sub': {
        const l = findLine(st, a.line), s = findStep(l, a.step), u = (s.subs || []).find(x => x.id === a.sub);
        if (!u) throw new Error('Unknown subtask');
        u.done = !u.done; if (u.done) u.doneAt = ctx.now; else delete u.doneAt;
        xp = u.done ? SUB_XP : -SUB_XP;
        award(st, ctx, { kind: 'sub', line: l.id, step: s.id, title: u.t, xp });
        msg = `quest(${l.id}): ${u.done ? 'check' : 'uncheck'} "${u.t}" (${s.id})`;
        break;
      }
      case 'add_sub': {
        const l = findLine(st, a.line), s = findStep(l, a.step), t = clean(a.t); if (!t) throw new Error('Subtask text is required');
        (s.subs = s.subs || []).push({ id: rid('s'), t, done: false });
        msg = `quest(${l.id}): add subtask "${t}" (${s.id})`;
        break;
      }
      case 'delete_sub': {
        const l = findLine(st, a.line), s = findStep(l, a.step);
        s.subs = (s.subs || []).filter(x => x.id !== a.sub); msg = `quest(${l.id}): delete subtask (${s.id})`;
        break;
      }
      case 'comment_step': {
        const l = findLine(st, a.line), s = findStep(l, a.step), c = clean(a.text, 2000); if (!c) break;
        (s.comments = s.comments || []).push({ at: ctx.now, text: c }); msg = `quest(${l.id}): comment on ${s.id}`;
        break;
      }
      case 'focus_add': {
        const l = findLine(st, a.line), s = findStep(l, a.step);
        if (st.focus.some(f => f.line === l.id && f.step === s.id)) break;
        if (st.focus.length >= FOCUS_MAX) throw new Error(`Today already has ${FOCUS_MAX} quests — finish or drop one first`);
        st.focus.push({ line: l.id, step: s.id }); msg = `today: add ${s.id} "${s.title}"`;
        break;
      }
      case 'focus_remove': {
        st.focus = st.focus.filter(f => !(f.line === a.line && f.step === a.step)); msg = `today: drop ${a.step}`;
        break;
      }
      case 'add_line': {
        const short = clean(a.short, 8).toUpperCase(), name = clean(a.name, 80); if (!short || !name) throw new Error('Name and short code are required');
        let id = clean(a.id, 12).toUpperCase(); if (!id) { let n = 1; st.lines.forEach(x => { const m = /^JL-(\d+)$/.exec(x.id); if (m) n = Math.max(n, +m[1] + 1); }); id = 'JL-' + String(n).padStart(2, '0'); }
        if (st.lines.some(x => x.id === id)) throw new Error('Line id already exists');
        const line = { id, short, name, prio: okPrio(a.prio), blurb: clean(a.blurb, 300), boss: null, steps: [] };
        if (clean(a.bossName) && okDate(a.bossDate)) line.boss = { name: clean(a.bossName, 60), date: a.bossDate, note: clean(a.bossNote, 120) };
        st.lines.push(line); msg = `quest: new line ${id} "${name}"`;
        break;
      }
      case 'edit_line': {
        const l = findLine(st, a.line);
        if (clean(a.name)) l.name = clean(a.name, 80); if (clean(a.short)) l.short = clean(a.short, 8).toUpperCase();
        if (a.prio) l.prio = okPrio(a.prio); if ('blurb' in a) l.blurb = clean(a.blurb, 300);
        if ('bossName' in a) l.boss = clean(a.bossName) && okDate(a.bossDate) ? { name: clean(a.bossName, 60), date: a.bossDate, note: clean(a.bossNote, 120) } : null;
        if (typeof a.move === 'number') { const i = st.lines.indexOf(l), j = Math.max(0, Math.min(st.lines.length - 1, i + a.move)); st.lines.splice(i, 1); st.lines.splice(j, 0, l); }
        msg = `quest: edit line ${l.id}`;
        break;
      }
      case 'add_event': {
        const title = clean(a.title, 120), date = okDate(a.date); if (!title || !date) throw new Error('Event needs a title and date');
        const e = { id: rid('e'), date, title, allDay: !!a.allDay || !okTime(a.start) };
        if (!e.allDay) { e.start = okTime(a.start); e.end = okTime(a.end) || e.start; }
        if (a.line) e.line = a.line;
        st.events.push(e); msg = `calendar: add "${title}" ${date}${e.start ? ' ' + e.start : ''}`;
        break;
      }
      case 'delete_event': { st.events = st.events.filter(e => e.id !== a.id); msg = 'calendar: delete event'; break; }
      case 'inbox_add': { const t = clean(a.t, 500); if (!t) throw new Error('Empty'); st.inbox.unshift({ id: rid('i'), t, at: ctx.now }); msg = 'inbox: capture'; break; }
      case 'inbox_delete': { st.inbox = st.inbox.filter(x => x.id !== a.id); msg = 'inbox: discard'; break; }
      case 'inbox_promote': {
        const it = st.inbox.find(x => x.id === a.id); if (!it) throw new Error('Unknown inbox item');
        const l = findLine(st, a.line);
        if (a.kind === 'sub') {
          const s = l.steps[Math.min(frontier(l), l.steps.length - 1)]; if (!s) throw new Error('Line has no steps yet');
          (s.subs = s.subs || []).push({ id: rid('s'), t: it.t.slice(0, 300), done: false });
        } else {
          const s = { id: nextTaskId(st, ctx.today), title: it.t.slice(0, 300), status: 'todo', priority: 'normal', subs: [], comments: [] };
          l.steps.push(s); (st.knownIds = st.knownIds || []).push(s.id);
        }
        st.inbox = st.inbox.filter(x => x !== it); msg = `quest(${l.id}): promote inbox item to ${a.kind === 'sub' ? 'subtask' : 'step'}`;
        break;
      }
      default: throw new Error('Unknown action ' + a.type);
    }
    return { state: st, msg, xp };
  }

  return { apply, XP, SUB_XP, LEVEL_XP, FOCUS_MAX, level, urgency, deadlineOf, frontier, dayDiff };
});

<script>/* Quest Log front end — vanilla JS, no build step. */
(() => {
  'use strict';
  const R = window.QuestReducer;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DEMO = !!window.QL_DEMO;
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const WD = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  const dobj = s => new Date(s + 'T12:00:00Z');
  const md = s => { const d = dobj(s); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`; };
  const addDays = (s, n) => { const d = dobj(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const short = id => id.replace(/^JL-/, '').replace(/^SIDE$/, 'SQ');

  let S = null; // {state, calendar, sync, today, now, tz}
  const U = { view: localStorage.getItem('ql.view') || 'map', open: null, stepOpen: {}, showDone: {}, completing: null, bossI: 0, shownXP: null, lateAll: false, cal: null, busy: false };
  try { U.open = localStorage.getItem('ql.open') || null; } catch { }

  /* ================= data / api ================= */
  function todayLocal(tz) { return new Intl.DateTimeFormat('en-CA', { timeZone: tz || 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
  function demoPayload() {
    const D = window.QL_DEMO;
    let saved = null; try { saved = JSON.parse(sessionStorage.getItem('ql.demo') || 'null'); } catch { }
    const state = saved || { lines: D.missions.lines, knownIds: [], player: D.player.player, focus: D.player.focus, events: D.events.events, inbox: D.inbox.inbox };
    return { state, calendar: D.calendar, sync: { state: 'demo' }, today: todayLocal(), now: new Date().toISOString(), tz: 'America/Los_Angeles' };
  }
  async function load() {
    if (DEMO) { S = demoPayload(); return; }
    const r = await fetch('api/state', { credentials: 'same-origin' });
    if (r.status === 401) return login();
    if (!r.ok) throw new Error('Server error ' + r.status);
    S = await r.json();
  }
  async function act(a, quiet) {
    try {
      if (DEMO) {
        const r = R.apply(S.state, a, { today: todayLocal(), now: new Date().toISOString() });
        S.state = r.state; try { sessionStorage.setItem('ql.demo', JSON.stringify(S.state)); } catch { }
        return { xp: r.xp, msg: r.msg };
      }
      const r = await fetch('api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(a) });
      const j = await r.json();
      if (r.status === 401) { login(); return null; }
      if (!r.ok) throw new Error(j.error || 'Request failed');
      const keepXP = U.shownXP; S = j; U.shownXP = keepXP;
      watchSync();
      return j;
    } catch (e) { if (!quiet) toast('HOLD ON', e.message, true); return null; }
  }
  let syncTimer = null;
  function watchSync(n = 0) {
    clearTimeout(syncTimer); if (DEMO) return;
    syncTimer = setTimeout(async () => {
      try { const j = await (await fetch('api/sync')).json(); S.sync = { ...S.sync, ...j.sync }; renderNav(); if (/pending|pushing/.test(S.sync.state) && n < 30) watchSync(n + 1); } catch { }
    }, n ? 2000 : 2500);
  }
  function login() {
    const d = document.createElement('div'); d.className = 'login';
    d.innerHTML = `<form class="card" style="width:min(360px,90vw)"><div class="sticker a">QUEST LOG</div><div class="fld"><label>Passcode</label><input type="password" id="pc" autofocus></div><div class="err" id="pce"></div><button class="btn dark" style="margin-top:12px;width:100%">ENTER</button></form>`;
    document.body.appendChild(d);
    d.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const r = await fetch('api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ passcode: $('#pc').value }) });
      if (r.ok) location.reload(); else $('#pce').textContent = 'Wrong passcode';
    };
  }

  /* ================= derived ================= */
  const lines = () => S.state.lines;
  const L = id => lines().find(l => l.id === id);
  const ST = (lid, sid) => { const l = L(lid); return l && l.steps.find(s => s.id === sid); };
  const urg = s => R.urgency(s, S.today);
  const isFocus = (lid, sid) => S.state.focus.some(f => f.line === lid && f.step === sid);
  function urgText(u, long) {
    if (!u) return '';
    if (u.level === 'late') return long ? `${u.kind === 'due' ? 'DUE' : 'PLANNED'} ${md(u.date)} · CHECK-IN` : 'CHECK-IN';
    if (u.days === 0) return 'TODAY';
    if (u.level === 'ok') return md(u.date);
    return `${u.days}D`;
  }
  function allUrgent() {
    const out = [];
    lines().forEach(l => l.steps.forEach(s => { const u = urg(s); if (u) out.push({ l, s, u }); }));
    return out;
  }
  function bosses() {
    return lines().filter(l => l.boss && l.boss.date && R.dayDiff(S.today, l.boss.date) >= 0)
      .map(l => ({ l, ...l.boss, days: R.dayDiff(S.today, l.boss.date) })).sort((a, b) => a.days - b.days);
  }

  /* ================= render ================= */
  function render() {
    if (!S) return;
    renderHeader(); renderNav(); renderView(); renderRail();
  }
  function renderHeader() {
    const p = S.state.player; if (U.shownXP == null) U.shownXP = p.xp;
    const xp = Math.max(0, Math.round(U.shownXP)), lv = R.level(xp), into = xp % R.LEVEL_XP;
    const lvEl = $('#lv'); const lvStr = String(lv).padStart(2, '0');
    if (lvEl.textContent !== lvStr) { lvEl.textContent = lvStr; lvEl.classList.remove('bump'); void lvEl.offsetWidth; lvEl.classList.add('bump'); }
    $('#xpfill').style.width = (into / R.LEVEL_XP * 100) + '%';
    $('#xptxt').textContent = `${into} / ${R.LEVEL_XP} XP`;
    $('#xpnext').textContent = `NEXT · LV ${lv + 1}`;
    $('#streak').textContent = p.streak || 0;
    $('#total').textContent = xp.toLocaleString('en-US');
    const d = dobj(S.today), n = S.state.focus.length;
    $('#date').innerHTML = `${WD[d.getUTCDay()]} · ${MON[d.getUTCMonth()]} ${String(d.getUTCDate()).padStart(2, '0')}<small>${n ? n + ' QUEST' + (n > 1 ? 'S' : '') + ' TODAY' : 'ALL CLEAR'}</small>`;
    if (!$('#face').innerHTML) $('#face').innerHTML = `<svg width="62" height="62" viewBox="68 -6 80 80">${giraffeSVG()}</svg>`;
  }
  function renderNav() {
    $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.go === U.view));
    $('#inboxN').textContent = S.state.inbox.length || '';
    const s = S.sync || {}, el = $('#sync');
    el.className = 'sync ' + (s.state || '');
    const label = { demo: 'DEMO MODE', disabled: 'GIT OFF', idle: 'READY', pending: 'SAVING…', pushing: 'PUSHING…', synced: 'SYNCED', committed: 'COMMITTED (PUSH OFF)', error: 'SYNC ERROR', conflict: 'CONFLICT' }[s.state] || 'SYNC';
    el.querySelector('span').textContent = label;
  }
  function renderView() {
    const v = $('#view');
    if (U.view === 'cal') return renderCal(v);
    if (U.view === 'inbox') return renderInbox(v);
    renderMap(v);
  }

  /* ---------- mission map ---------- */
  function renderMap(v) {
    const pbOld = $('#pb'); const keepTop = pbOld ? pbOld.scrollTop : 0;
    const trailKeep = {}; $$('.trail').forEach(t => trailKeep[t.dataset.trail] = t.scrollLeft);
    const d = dobj(S.today);
    v.innerHTML = `
      <div class="ph"><h2>MISSION <span>NETWORK</span></h2><span class="hint">Click a line to open its steps</span><div class="sp"></div>
        <span class="tag"><i style="background:var(--red)"></i>≤3 DAYS</span><span class="tag"><i style="background:var(--hi)"></i>≤7 DAYS</span><span class="tag"><i style="background:var(--ink);color:var(--paper)">?</i>CHECK-IN</span>
        <button class="btn sm" data-act="newline">+ LINE</button></div>
      <div class="pb" id="pb"><div class="net" id="net"><svg class="trunks" id="trunks"></svg>
        <div class="hub" id="hub">NOW<small>${WD[d.getUTCDay()]} ${String(d.getUTCMonth() + 1).padStart(2, '0')}.${String(d.getUTCDate()).padStart(2, '0')}</small></div>
        ${lines().map(rowHTML).join('')}</div></div>`;
    $('#pb').scrollTop = keepTop;
    $$('.trail').forEach(t => { if (trailKeep[t.dataset.trail] != null) t.scrollLeft = trailKeep[t.dataset.trail]; else focusTrail(t); dragScroll(t, 'x'); });
    drawTrunks();
  }
  function rowHTML(l) {
    const f = R.frontier(l), cur = l.steps[f], open = U.open === l.id;
    const done = l.steps.filter(s => s.status === 'done').length;
    const mini = l.steps.map((s, i) => `${i ? `<b class="${i <= f ? '' : 'dot'}"></b>` : ''}<i class="${s.status === 'done' ? 'd' : i === f ? 'c' : ''}"></i>`).join('');
    let pill = '';
    if (cur) {
      const u = urg(cur); const lv = u ? u.level : '';
      const tag = !u ? '' : lv === 'late' ? '<span class="qi">?</span>' : `<span class="d">${urgText(u)}</span>`;
      pill = `<button class="cur ${lv}" data-goto="${l.id}|${cur.id}" title="${esc(cur.title)}${u ? ' — ' + urgText(u, true) : ''}">${tag}<span class="tx">${esc(cur.title)}</span></button>`;
    } else pill = `<span class="cur">ALL STEPS CLEARED ✓</span>`;
    const boss = l.boss && R.dayDiff(S.today, l.boss.date) >= 0 ? `<span class="bt">${esc(l.boss.name)} <b>${R.dayDiff(S.today, l.boss.date)}D</b></span>` : '';
    return `<div class="row ${l.prio === 'low' ? 'low' : ''} ${open ? 'open' : ''}" data-line="${l.id}">
      <div class="rhead"><button class="chip" data-toggle="${l.id}" title="${esc(l.name)}"><span class="id">${short(l.id)}</span><span class="nm">${esc(l.short)}</span><span class="ct">${done}/${l.steps.length}</span>
        <svg class="car" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="mini">${mini}</div>${pill}${boss}</div>
      ${open ? `<div class="exp" data-exp="${l.id}">${expHTML(l)}</div>` : ''}</div>`;
  }
  function expHTML(l) {
    const f = R.frontier(l);
    const stations = l.steps.map((s, i) => {
      const u = urg(s), cls = s.status === 'done' ? 'done' : i === f ? 'now' : '';
      const when = u ? `<span class="when ${u.level}">${u.level === 'late' ? '? ' + md(u.date) : urgText(u)}</span>` : '';
      return `<div class="stn ${cls}" data-jump="${l.id}|${s.id}" title="${esc(s.title)}"><div class="seg ${s.status === 'done' ? 'solid' : 'dots'}"></div><div class="o"></div><div class="t">${esc(s.title)}</div>${when}</div>`;
    }).join('');
    const nDone = l.steps.filter(s => s.status === 'done').length, showDone = U.showDone[l.id];
    const steps = l.steps.map((s, i) => (s.status === 'done' && !showDone) ? '' : stepHTML(l, s, i === f)).join('');
    const b = l.boss;
    return `<div class="exp-in">
      <div class="exp-top"><div><h3>${esc(l.name)}</h3>${l.blurb ? `<p>${esc(l.blurb)}</p>` : ''}
        ${b ? `<div class="meta" style="margin-top:8px;display:flex;gap:6px"><span class="chipx hi">BOSS · ${esc(b.name)} · ${md(b.date)}</span>${b.note ? `<span class="chipx id">${esc(b.note)}</span>` : ''}</div>` : ''}</div>
        <div class="acts"><button class="btn sm acc" data-act="addstep" data-line="${l.id}">+ STEP</button><button class="btn sm" data-act="editline" data-line="${l.id}">EDIT LINE</button><button class="btn sm ghost" data-toggle="${l.id}">CLOSE ✕</button></div></div>
      <div class="trail" data-trail="${l.id}">${stations || '<div class="calnote" style="padding:10px">No steps yet — add the first one.</div>'}</div>
      <div class="steps">
        ${nDone ? `<button class="more" data-showdone="${l.id}">${showDone ? '▾ HIDE' : '▸ SHOW'} ${nDone} CLEARED STEP${nDone > 1 ? 'S' : ''}</button>` : ''}
        ${steps}
        <div class="addrow" style="margin-top:12px"><input class="inp" data-addstep="${l.id}" placeholder="Add a main step to ${esc(l.short)} and press Enter…"></div>
      </div></div>`;
  }
  function stepHTML(l, s, isNow) {
    const key = l.id + '|' + s.id, done = s.status === 'done', u = urg(s);
    const open = U.stepOpen[key] != null ? U.stepOpen[key] : (isNow && !done);
    const subs = s.subs || [], sd = subs.filter(x => x.done).length;
    const chips = [
      `<span class="chipx id">${s.checkpoint ? 'CHECKPOINT' : esc(s.id)}</span>`,
      s.priority === 'high' ? '<span class="chipx hi">HIGH</span>' : s.priority === 'low' ? '<span class="chipx lo">LOW</span>' : '',
      s.status === 'doing' ? '<span class="chipx doing">DOING</span>' : '',
      u ? `<span class="chipx ${u.level}">${u.kind === 'due' ? 'DUE' : 'PLAN'} ${md(u.date)}${u.level !== 'late' && u.level !== 'ok' ? ' · ' + urgText(u) : u.level === 'late' ? ' · CHECK-IN' : ''}</span>` : (done && s.doneAt ? `<span class="chipx id">DONE ${md(s.doneAt.slice(0, 10))}</span>` : ''),
      subs.length ? `<span class="chipx id">${sd}/${subs.length} SUB</span>` : '',
      (s.comments || []).length ? `<span class="chipx id">💬 ${(s.comments || []).length}</span>` : '',
    ].join('');
    const completing = U.completing && U.completing.key === key && U.completing.where === 'line';
    return `<div class="st ${done ? 'done' : ''} ${isNow ? 'now' : ''}" id="st-${cssId(key)}">
      <div class="sr"><button class="cb ${done ? 'done' : ''}" data-complete="${key}" data-where="line" title="${done ? 'Reopen' : 'Complete with a comment'}"></button>
        <div class="tt" data-expand="${key}"><b>${esc(s.title)}</b><div class="meta">${chips}</div></div>
        ${!done ? `<button class="ic ${isFocus(l.id, s.id) ? 'on' : ''}" data-focus="${key}" title="${isFocus(l.id, s.id) ? 'In today — click to drop' : 'Add to today'}">★</button>` : ''}
        <button class="ic" data-edit="${key}" title="Edit step"><svg viewBox="0 0 16 16"><path d="M3 11.5V13h1.5l7-7L10 4.5zM11 3.5l1.5 1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button></div>
      ${completing ? cformHTML(l, s) : ''}
      ${open ? `<div class="sbody">
        ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
        ${subs.map(x => `<div class="sub ${x.done ? 'dn' : ''}"><button class="cb s ${x.done ? 'on' : ''}" data-sub="${key}|${x.id}"></button><span>${esc(x.t)}</span><button class="x" data-delsub="${key}|${x.id}" title="Delete subtask">✕</button></div>`).join('')}
        ${!done ? `<div class="addrow"><input class="inp" data-addsub="${key}" placeholder="Add a subtask and press Enter…"></div>` : ''}
        ${(s.comments || []).map(c => `<div class="cmt">${esc(c.text)}<small>${c.at.slice(0, 10)}</small></div>`).join('')}
        <div class="addrow"><input class="inp" data-comment="${key}" placeholder="Add a progress note and press Enter…" style="border-style:dashed"></div>
      </div>` : ''}
    </div>`;
  }
  const cssId = k => k.replace(/[^a-zA-Z0-9]/g, '_');
  function cformHTML(l, s) {
    return `<div class="cform"><div class="cform-in"><textarea data-cmt placeholder="Comment (optional): what got done, anything for next time…"></textarea>
      <div class="row2"><button class="btn acc" data-submit="${l.id}|${s.id}" title="Ctrl+Enter">SUBMIT · +${R.XP[s.priority] || 30} XP</button><button class="btn ghost" data-cancel>CANCEL</button></div></div></div>`;
  }
  function focusTrail(t) {
    const st = [...t.querySelectorAll('.stn')], i = st.findIndex(x => x.classList.contains('now'));
    if (i > 0) t.scrollLeft = (i - 1) * 168 + 18;
  }
  function drawTrunks() {
    const net = $('#net'), svg = $('#trunks'); if (!net || !svg || getComputedStyle(svg).display === 'none') return;
    const nr = net.getBoundingClientRect();
    const rows = $$('.row', net).map(r => { const c = $('.chip', r).getBoundingClientRect(); return { y: c.top - nr.top + c.height / 2, x: c.left - nr.left, low: r.classList.contains('low'), open: r.classList.contains('open') }; });
    if (!rows.length) return;
    const hubY = (rows[0].y + rows[rows.length - 1].y) / 2; $('#hub').style.top = hubY + 'px';
    const above = rows.filter(r => r.y < hubY - 1), below = rows.filter(r => r.y > hubY + 1);
    svg.setAttribute('width', nr.width); svg.setAttribute('height', net.scrollHeight);
    let p = '';
    rows.forEach((r, i) => {
      const o = (i - (rows.length - 1) / 2) * 5;
      let sx; const ai = above.indexOf(r), bi = below.indexOf(r);
      if (ai >= 0) sx = 124 + ai * 9; else if (bi >= 0) sx = 124 + (below.length - 1 - bi) * 9; else sx = null;
      const col = r.open ? 'var(--acc)' : r.low ? 'var(--grey)' : 'var(--ink)';
      const d = sx == null ? `M74 ${r.y} L${r.x} ${r.y}` : `M74 ${hubY + o} L${sx} ${hubY + o} L${sx} ${r.y} L${r.x} ${r.y}`;
      p += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${r.open ? 6 : r.low ? 3 : 4.5}" stroke-linejoin="round" ${r.open ? 'style="paint-order:stroke"' : ''}/>`;
    });
    svg.innerHTML = p;
  }
  function animateTrunks(ms = 450) { const t0 = performance.now(); const f = t => { drawTrunks(); if (t - t0 < ms) requestAnimationFrame(f); }; requestAnimationFrame(f); }
  function toggleLine(id) {
    const prev = U.open; U.open = prev === id ? null : id;
    try { localStorage.setItem('ql.open', U.open || ''); } catch { }
    if (prev) { const e = $(`.exp[data-exp="${prev}"]`); if (e) { const h = e.offsetHeight; e.animate([{ height: h + 'px', opacity: 1 }, { height: '0px', opacity: 0 }], { duration: 250, easing: 'ease-in' }); } }
    setTimeout(() => {
      renderMap($('#view'));
      const e = U.open && $(`.exp[data-exp="${U.open}"]`);
      if (e) {
        const h = e.offsetHeight; e.animate([{ height: '0px', opacity: 0 }, { height: h + 'px', opacity: 1 }], { duration: 380, easing: 'cubic-bezier(.3,1.2,.5,1)' });
        const pb = $('#pb'), row = e.closest('.row'); setTimeout(() => pb.scrollTo({ top: Math.max(0, row.offsetTop - 10), behavior: 'smooth' }), 60);
      }
      animateTrunks(520);
    }, prev ? 200 : 0);
  }
  function gotoStep(lid, sid) {
    U.view = 'map'; U.open = lid; if (sid) { U.stepOpen[lid + '|' + sid] = true; const s = ST(lid, sid); if (s && s.status === 'done') U.showDone[lid] = true; }
    try { localStorage.setItem('ql.view', 'map'); localStorage.setItem('ql.open', lid); } catch { }

  /* ---------- completion + XP flow ---------- */
  function openComplete(key, where) {
    const [lid, sid] = key.split('|'), s = ST(lid, sid); if (!s) return;
    if (s.status === 'done') return confirmBox('REOPEN STEP?', `“${esc(s.title)}” goes back to the to-do list and −${R.XP[s.priority] || 30} XP.`, 'REOPEN', async () => { const r = await act({ type: 'reopen_step', line: lid, step: sid }); if (r) { U.shownXP = S.state.player.xp; render(); } });
    U.completing = U.completing && U.completing.key === key && U.completing.where === where ? null : { key, where };

  async function submitComplete(key, btn) {
    if (U.busy) return; U.busy = true;

    const cb = $('.cb', host).getBoundingClientRect(), from = { x: cb.left + cb.width / 2, y: cb.top + cb.height / 2 };
    const oldXP = U.shownXP;
    $('.cb', host).classList.add('on');

    const r = await act({ type: 'complete_step', line: lid, step: sid, comment });
    await vanish; U.busy = false;
    if (!r) { render(); return; }
    U.completing = null; U.shownXP = oldXP; render();
    const s = ST(lid, sid); toast(`QUEST CLEARED · +${r.xp} XP`, esc(s ? s.title : ''));
    flyXP(from, r.xp, oldXP, S.state.player.xp);
  }
  function flyXP(from, amount, oldXP, newXP) {
    if (!(amount > 0)) { U.shownXP = newXP; renderHeader(); return; }
    const fx = $('#fx'), bar = $('#xpbar').getBoundingClientRect();
    const fill = $('#xpfill').getBoundingClientRect();
    const to = { x: Math.min(bar.right - 14, Math.max(bar.left + 14, fill.right)), y: bar.top + bar.height / 2 };
    const plus = document.createElement('div'); plus.className = 'plus'; plus.textContent = '+' + amount; plus.style.left = (from.x + 14) + 'px'; plus.style.top = (from.y - 30) + 'px'; fx.appendChild(plus);
    plus.animate([{ transform: 'translateY(10px) scale(.6)', opacity: 0 }, { transform: 'translateY(-10px) scale(1.15)', opacity: 1, offset: .3 }, { transform: 'translateY(-40px)', opacity: 0 }], { duration: 1100, easing: 'ease-out' }).finished.then(() => plus.remove());
    const n = Math.max(6, Math.min(14, Math.round(amount / 4)));
    let landed = 0;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div'); c.className = 'coin'; c.textContent = 'XP'; fx.appendChild(c);
      const mx = (from.x + to.x) / 2 + (Math.random() - .5) * 260, my = Math.min(from.y, to.y) - 60 - Math.random() * 120;
      const a = c.animate([
        { transform: `translate(${from.x}px,${from.y}px) scale(.4)`, opacity: 0 },
        { transform: `translate(${from.x + (Math.random() - .5) * 60}px,${from.y - 20 - Math.random() * 30}px) scale(1.1)`, opacity: 1, offset: .15 },
        { transform: `translate(${mx}px,${my}px) scale(1)`, opacity: 1, offset: .55 },
        { transform: `translate(${to.x}px,${to.y}px) scale(.5)`, opacity: .9 }],
        { duration: 900 + i * 25, delay: i * 55, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'forwards' });
      a.finished.then(() => {
        c.remove(); landed++;
        const xb = $('#xpbar'); xb.classList.add('glow'); clearTimeout(xb._t); xb._t = setTimeout(() => xb.classList.remove('glow'), 250);
        U.shownXP = oldXP + (newXP - oldXP) * landed / n; renderHeader();
        if (landed === n) { U.shownXP = newXP; renderHeader(); if (R.level(newXP) > R.level(oldXP)) levelUp(R.level(newXP)); }
      });
    }
  }
  function levelUp(lv) {

  /* ---------- calendar ---------- */
  const CAL = { colW: 156, h0: 6, h1: 24, hh: 44, back: 7, fwd: 180 };
  function renderCal(v) {
    const keep = U.cal;

    const days = [...Array(N)].map((_, i) => addDays(start, i));
    const g = (S.calendar && S.calendar.events) || [], mine = S.state.events || [];
    const dls = []; lines().forEach(l => l.steps.forEach(s => { const d = R.deadlineOf(s); if (d && s.status !== 'done') dls.push({ l, s, d, u: urg(s) }); }));
    const W = CAL.colW, H = (CAL.h1 - CAL.h0) * CAL.hh;
    const toY = t => { const [h, m] = t.split(':').map(Number); return (h - CAL.h0 + m / 60) * CAL.hh; };
    const head = days.map(d => { const o = dobj(d), wk = o.getUTCDay() === 1, rel = R.dayDiff(S.today, d); return `<div class="dh ${d === S.today ? 'today' : ''} ${wk ? 'wk' : ''} ${rel < 0 ? 'past' : ''}" style="width:${W}px">${WD[o.getUTCDay()]}${d === S.today ? ' · TODAY' : ''}<b>${MON[o.getUTCMonth()]} ${o.getUTCDate()}</b></div>`; }).join('');
    const allday = days.map(d => {
      const items = [
        ...g.filter(e => e.date === d && e.allDay).map(e => `<button class="ad g" data-gev="${esc(JSON.stringify(e))}">${esc(e.title)}</button>`),
        ...mine.filter(e => e.date === d && e.allDay).map(e => `<button class="ad" style="background:var(--hi)" data-mev="${e.id}">${esc(e.title)}</button>`),
        ...dls.filter(x => x.d.date === d).map(x => `<button class="ad dl ${x.d.kind} ${x.u ? x.u.level : ''}" data-goto="${x.l.id}|${x.s.id}" title="${x.d.kind === 'due' ? 'Due' : 'Planned'}: ${esc(x.s.title)}">◆ ${esc(x.l.short)} · ${esc(x.s.title)}</button>`)];
      return `<div class="day" style="width:${W}px">${items.join('')}</div>`;
    }).join('');
    const cols = days.map(d => {
      const o = dobj(d), evs = [...g.filter(e => e.date === d && !e.allDay).map(e => ({ ...e, g: true })), ...mine.filter(e => e.date === d && !e.allDay)].filter(e => e.start).sort((a, b) => a.start.localeCompare(b.start));
      lanes(evs);
      const body = evs.map(e => {
        const y = Math.max(0, toY(e.start)), h2 = Math.max(24, toY(e.end || e.start) - toY(e.start) - 3);
        const w = 100 / e._n, left = e._lane * w;
        const attr = e.g ? `data-gev="${esc(JSON.stringify({ title: e.title, date: e.date, start: e.start, end: e.end, location: e.location, url: e.url, conflict: e.conflict }))}"` : `data-mev="${e.id}"`;
        return `<button class="ev ${e.g ? 'g' : 'mine'}" ${attr} style="top:${y}px;height:${h2}px;left:calc(${left}% + 4px);right:auto;width:calc(${w}% - 8px)">${esc(e.title)}<small>${e.start}–${e.end || ''}${e.location ? ' · ' + esc(e.location) : ''}</small></button>`;
      }).join('');
      let now = '';
      if (d === S.today) { const t = new Intl.DateTimeFormat('en-GB', { timeZone: S.tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date()); now = `<div class="nowl" style="top:${toY(t)}px"></div>`; }
      return `<div class="col ${o.getUTCDay() === 1 ? 'wk' : ''} ${d === S.today ? 'today' : ''} ${R.dayDiff(S.today, d) < 0 ? 'past' : ''}" data-day="${d}" style="width:${W}px;height:${H}px">${body}${now}</div>`;
    }).join('');
    const gut = [...Array(CAL.h1 - CAL.h0)].map((_, i) => `<div style="height:${CAL.hh}px">${String(CAL.h0 + i).padStart(2, '0')}:00</div>`).join('');
    const c = S.calendar || {};
    v.innerHTML = `
      <div class="ph"><h2>CAL<span>ENDAR</span></h2><span class="month" id="month"></span><div class="sp"></div>
        <div class="calbar"><button class="btn sm" data-cal="-7" title="Previous week">‹ WEEK</button><button class="btn sm dark" data-cal="today">TODAY</button><button class="btn sm" data-cal="7" title="Next week">WEEK ›</button><button class="btn sm acc" data-act="newevent">+ EVENT</button></div></div>
      <div class="ph" style="padding-top:0"><span class="calnote">${c.ok === false ? '⚠ ' + esc(c.error) : `Google Calendar export${c.exportedAt ? ' · ' + esc(c.exportedAt) : ''}${c.covered ? ' · covers ' + esc(c.covered) : ''}`} · ◆ = quest planned/due dates · drag or scroll to move in time · click an empty slot to add an event</span></div>
      <div class="cal" id="cal"><div class="cg" style="width:${58 + N * W}px">
        <div class="ch"><div class="gut"></div>${head}</div>
        <div class="cad"><div class="gut">ALL DAY</div>${allday}</div>
        <div class="cbody"><div class="gut">${gut}</div>${cols}</div>
      </div></div>`;
    const cal = $('#cal');
    if (keep) { cal.scrollLeft = keep.left; cal.scrollTop = keep.top; }
    else { cal.scrollLeft = (CAL.back - 1) * W; cal.scrollTop = (8 - CAL.h0) * CAL.hh; }
    const upd = () => { U.cal = { left: cal.scrollLeft, top: cal.scrollTop }; const i = Math.min(N - 1, Math.floor((cal.scrollLeft + W * 2) / W)); const o = dobj(days[i]); $('#month').textContent = `${['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'][o.getUTCMonth()]} ${o.getUTCFullYear()}`; };
    cal.addEventListener('scroll', upd, { passive: true }); upd();
    dragScroll(cal, 'xy');
  }
  function lanes(evs) {
    let cluster = [], end = '';
    const flush = () => { const n = Math.max(1, ...cluster.map(e => e._lane + 1)); cluster.forEach(e => e._n = n); cluster = []; };
    evs.forEach(e => {
      if (cluster.length && e.start >= end) flush();
      const used = cluster.filter(o => o.end > e.start).map(o => o._lane); let k = 0; while (used.includes(k)) k++;
      e._lane = k; cluster.push(e); end = cluster.reduce((m, o) => (o.end || o.start) > m ? (o.end || o.start) : m, '');
    });
    if (cluster.length) flush();
  }
  function dragScroll(el, axes) {
    let sx = 0, sy = 0, sl = 0, st = 0, down = false; el._moved = false;
    el.addEventListener('mousedown', e => { if (e.button !== 0 || e.target.closest('button,input,textarea,a')) return; down = true; el._moved = false; sx = e.clientX; sy = e.clientY; sl = el.scrollLeft; st = el.scrollTop; });
    window.addEventListener('mousemove', e => { if (!down) return; const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) + Math.abs(dy) > 5) { el._moved = true; el.classList.add('drag'); } if (axes.includes('x')) el.scrollLeft = sl - dx; if (axes.includes('y')) el.scrollTop = st - dy; });
    window.addEventListener('mouseup', () => { if (down) { down = false; el.classList.remove('drag'); setTimeout(() => el._moved = false, 0); } });
  }
